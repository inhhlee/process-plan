management:
  source_of_truth: "이 YAML은 목업 설계 방법만 관리한다. 기능·데이터·정책 정의는 담당 명세를 따른다."
  reference_base: "참조 경로는 이 YAML 파일이 있는 폴더를 기준으로 해석한다."
  editing: "UTF-8, 공백 2칸 들여쓰기, 중복 키 금지. 날짜와 버전은 문자열로 작성한다."
  schema_version_meaning: "작성 항목의 구조 버전이다. 2.0은 과제 정의에서 평가 결과를 분리한 구조이며 별도 자동 검사 스키마를 제공한다는 뜻은 아니다."
  usage:
    - "설계 시작 시 references의 최신 버전과 관련 ID를 확인한다."
    - "workflow를 기본 순서로 수행하되, 평가 결과에 따라 iteration_rules의 해당 단계로 돌아가 수정·재평가한다. 산출물 위치는 과제계획에 연결한다."
    - "screen_template을 화면별 설계 산출물의 작성 항목으로 사용한다."
    - "사용성 평가 기록은 usability_records_template의 tasks와 evaluations에 각 과제·결과 양식을 복사하여 작성한다. 실제 기록 파일은 과제계획의 산출물 위치에 연결한다."
    - "방법 변경은 이 파일의 version·updated_on·change_history에 함께 반영한다."
    - "새 정책 결정은 결정사항에 먼저 기록하고 영향받는 명세·계획을 연결한다."
  scope: "과제3 GUI-01~05의 목업 설계·검토와 구현 전달"
  evidence_rule: "설계 검토, Mock 화면 실행, 사용자 사용성 평가, 실제 Core·MQTT 연동의 결과를 각각 기록한다."

