# GUI 목업을 설계하고 검토하는 절차의 수정 원본이다.
# YAML만 수정해도 화면이 자동 생성되거나 실행 설정에 반영되지는 않는다.
schema_version: "2.0"
document:
  title: "AMR 관제 GUI 목업 설계 방법론"
  version: "0.3"
  created_on: "2026-10-23"
  updated_on: "2026-10-23"
  author: "Codex 작성 보조"
  basis: "사용자의 GUI 목업 설계 방법론 YAML 관리 요청"
  purpose: "화면마다 같은 순서로 요구·흐름·배치·상태·확인 기준을 설계한다."
  status:
    document: "초안 작성 완료"
    user_review: "사용자 검토 대기"
    design_decision: "제안"
    gui_implementation: "이 파일의 작성 범위에 해당 없음"
